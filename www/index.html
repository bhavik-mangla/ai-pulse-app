<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      user-scalable is intentionally left enabled: pinch-zoom is an
      accessibility requirement and blocking it is flagged in store review.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Pulse</title>

    <!--
      Apply the stored theme before first paint. Doing this in the app bundle
      meant the default light palette painted first and dark-mode readers saw a
      white flash on every cold start.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("gov_theme") || "dark";
        } catch (e) {
          /* Storage unavailable; fall back to the default. */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/sheet.css" />
  </head>
  <body>
    <nav>
      <div class="status-bar-spacer"></div>
      <div class="nav-inner">
        <div class="brand">
          <div>
            <a href="/" class="logo">AI<span>Pulse</span></a>
            <span id="header-date" class="badge"></span>
          </div>
        </div>
        <div class="nav-actions">
          <button class="btn-icon" id="country-btn" data-action="open-filters" aria-label="Region">
            🌍
          </button>
          <button class="btn-icon btn-saved" data-action="show-saved" aria-label="Saved stories">
            ★<span class="count-badge" id="saved-count" hidden></span>
          </button>
          <button class="btn-icon" data-action="open-filters" aria-label="Preferences">⚙️</button>
          <button class="btn-icon" id="theme-btn" data-action="toggle-theme" aria-label="Toggle theme">
            🌙
          </button>
        </div>
      </div>

      <!--
        Topic tabs are the primary navigation. Swiping the feed horizontally
        moves between them, so changing topic never needs the settings sheet.
      -->
      <div id="topic-strip" class="topic-strip" role="tablist" aria-label="Topics"></div>
    </nav>

    <div id="mode-banner" class="mode-banner" hidden></div>

    <div id="pull-indicator">↓</div>

    <div id="feed-container">
      <div id="cards-stack">
        <div class="feed-item skeleton"><div class="card-inner"></div></div>
      </div>
      <div id="infinite-scroll-trigger" style="height: 100px; width: 100%"></div>
    </div>

    <div id="filters-overlay">
      <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <h2 class="sheet-title" id="sheet-title">Preferences</h2>

        <!-- Region comes first: it decides which feed everything else filters. -->
        <div class="filter-group">
          <label class="filter-label" id="label-region">Region</label>
          <div class="chip-row" id="country-options"></div>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="search-q" id="label-search">Search</label>
          <input type="text" id="search-q" class="search-input" placeholder="Search" />
        </div>

        <!--
          Interests replace the old "Who are you?" filter, which asked for a
          profession. What a reader wants from a news app is topics, not a job
          title, and several at once rather than one.
        -->
        <div class="filter-group">
          <label class="filter-label" id="label-interests">Interests</label>
          <p class="filter-hint" id="hint-interests">
            Pick the topics you want to see. Leave empty for everything.
          </p>
          <div class="chip-row chip-wrap" id="interest-options"></div>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="sel-src" id="label-src">Source</label>
          <select id="sel-src" class="filter-select">
            <option value="">All Sources</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-date" id="label-date">Date</label>
          <input type="date" id="filter-date" class="filter-date" />
        </div>

        <div class="filter-group">
          <button id="btn-top-stories" class="btn-toggle" data-action="toggle-top-stories">
            <span id="label-top-stories">Top Stories Only</span> ⭐
          </button>
        </div>

        <div class="filter-group setting-row" id="digest-row" hidden>
          <span class="filter-label" id="label-digest">Daily reminder</span>
          <div class="setting-controls">
            <input type="time" id="digest-time" class="filter-time" hidden />
            <button class="btn-chip" id="btn-digest" data-action="toggle-digest"
                    role="switch" aria-pressed="false">🔔</button>
          </div>
        </div>

        <div class="filter-group">
          <button class="btn-toggle" data-action="show-saved">
            <span id="label-saved">Saved stories</span> ★
          </button>
        </div>

        <div class="sheet-actions">
          <button class="btn-secondary" id="btn-reset" data-action="reset-filters">
            Reset filters
          </button>
          <button class="btn-action" id="btn-done" data-action="close-filters">Done</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script src="capacitor.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
