<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      user-scalable is intentionally left enabled: pinch-zoom is an
      accessibility requirement and blocking it is flagged in store review.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Pulse</title>

    <!--
      Apply the stored theme before first paint. Doing this in the app bundle
      meant the default light palette painted first and dark-mode readers saw a
      white flash on every cold start.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("gov_theme") || "dark";
        } catch (e) {
          /* Storage unavailable; fall back to the default. */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/sheet.css" />
  </head>
  <body>
    <nav>
      <div class="status-bar-spacer"></div>
      <div class="nav-inner">
        <div class="brand">
          <div>
            <a href="/" class="logo">AI<span>Pulse</span></a>
            <span id="header-date" class="badge"></span>
          </div>
        </div>
        <div class="nav-actions">
          <button class="btn-icon" id="lang-btn" data-action="toggle-lang" aria-label="Switch language">
            हिन्दी
          </button>
          <button class="btn-icon" data-action="open-filters" aria-label="Preferences">⚙️</button>
          <button class="btn-icon" data-action="toggle-theme" aria-label="Toggle theme">🌓</button>
        </div>
      </div>
    </nav>

    <div id="pull-indicator">↓</div>

    <div id="feed-container">
      <div id="cards-stack">
        <div class="feed-item skeleton"><div class="card-inner"></div></div>
      </div>
      <div id="infinite-scroll-trigger" style="height: 100px; width: 100%"></div>
    </div>

    <div id="filters-overlay">
      <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <h2 class="sheet-title">Preferences</h2>

        <div class="feed-type-toggle">
          <button id="btn-type-news" class="feed-type-btn active" data-action="feed-news">
            General
          </button>
          <button id="btn-type-official" class="feed-type-btn" data-action="feed-official">
            Official
          </button>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="search-q">Search</label>
          <input type="text" id="search-q" class="search-input" placeholder="Keywords..." />
        </div>

        <div class="filter-group">
          <label class="filter-label" for="sel-src" id="label-src">Source Portal</label>
          <select id="sel-src" class="filter-select">
            <option value="">All Portals</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="sel-cat" id="label-cat">Category</label>
          <select id="sel-cat" class="filter-select">
            <option value="">All Categories</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="sel-audience" id="label-audience">Who are you?</label>
          <select id="sel-audience" class="filter-select">
            <option value="">Who are you?</option>
          </select>
        </div>

        <div class="filter-group">
          <button id="btn-high-impact" class="btn-toggle" data-action="toggle-high-impact">
            <span id="label-high-impact">High Impact Only</span> 🚨
          </button>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-date">Filter by Date</label>
          <input type="date" id="filter-date" class="filter-date" />
        </div>

        <button class="btn-action" data-action="close-filters">Done</button>
      </div>
    </div>

    <div id="toast"></div>

    <script src="capacitor.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
