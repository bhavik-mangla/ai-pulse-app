name: Feature or idea
description: Suggest something the app should do
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Who is it for, and why does it help them?
      description: A concrete reader situation is more persuasive than a feature name.
    validations:
      required: true
